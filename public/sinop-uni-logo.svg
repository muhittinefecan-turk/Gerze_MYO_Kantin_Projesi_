<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="snupNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#081836"/>
    </linearGradient>
    <linearGradient id="snupGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="snupCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="80" cy="80" r="76" fill="url(#snupNavy)" stroke="url(#snupGold)" stroke-width="4"/>
  <circle cx="80" cy="80" r="70" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- University Sun / Maritime Waves Compass -->
  <g transform="translate(80, 80)">
    <!-- Sea waves representing Black Sea Sinop -->
    <path d="M-40,24 C-25,16 -10,32 5,24 C20,16 35,32 40,24" stroke="url(#snupCyan)" stroke-width="3" stroke-linecap="round"/>
    <path d="M-36,34 C-22,27 -8,41 6,34 C20,27 33,41 36,34" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Torch & Book Motif of Wisdom -->
    <path d="M-18,-8 L18,-8 L14,14 L0,20 L-14,14 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M0,-8 L0,19" stroke="#0f2b5c" stroke-width="1.5"/>
    
    <!-- Torch flame / Lighthouse rays -->
    <path d="M0,-36 C-6,-26 -2,-18 0,-12 C2,-18 6,-26 0,-36 Z" fill="url(#snupGold)"/>
    <circle cx="0" cy="-22" r="3" fill="#fef08a"/>
    
    <!-- Stars -->
    <circle cx="-28" cy="-14" r="2.5" fill="url(#snupGold)"/>
    <circle cx="28" cy="-14" r="2.5" fill="url(#snupGold)"/>
  </g>

  <!-- University Text Ring -->
  <text x="80" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">SİNOP ÜNİVERSİTESİ</text>
  <text x="80" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="url(#snupGold)" text-anchor="middle" letter-spacing="1.5">GERZE MYO · 2007</text>
</svg>
